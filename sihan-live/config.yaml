app:
  name: sihan-live-backend
  owner_id: nac
  # Dev-only key. Override in production via a non-committed *.local.yaml or env.
  api_key: local-dev-key
  host: 0.0.0.0
  # 8080 keeps the API clear of a local llama-server on :8000.
  port: 8080
  persona_name: 赵思涵

knowledge_base:
  storage_path: ./data/knowledge_store.json
  chunk_size: 400
  chunk_overlap: 80
  allowed_roots:
    - ./data/kb_seed

llm:
  # Set enabled: true to route /chat through a real OpenAI-compatible model
  # such as a local llama-server. When disabled (or unreachable) the persona
  # engine answers from retrieved memory alone.
  enabled: false
  base_url: http://127.0.0.1:8000/v1
  model: qwen3.6-hauhau
  api_key: null
  timeout: 30.0
  temperature: 0.7
  max_tokens: 512
